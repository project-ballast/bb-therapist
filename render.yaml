# Render Blueprint: New > Blueprint, pick this repo, then fill in the two secrets.
services:
  - type: web
    name: steady
    runtime: node
    plan: free # free sleeps after ~15 min idle (first reply 30-60s); "starter" (~$7/mo) stays awake
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSCODE
        sync: false
